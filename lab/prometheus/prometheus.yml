# ============================================================
# Конфигурация Prometheus
# ============================================================
# Prometheus собирает метрики с указанных целей (targets)
# каждые 15 секунд и хранит их в своей базе данных.

global:
  scrape_interval: 15s            # Как часто собирать метрики
  evaluation_interval: 15s        # Как часто оценивать правила

# Правила записи и оповещения (можно добавить позже)
# rule_files:
#   - "rules.yml"

# Конфигурация сбора метрик
scrape_configs:
  # --------------------------------------------------------
  # Метрики самого приложения (FastAPI)
  # --------------------------------------------------------
  - job_name: 'fastapi-app'
    scrape_interval: 10s
    static_configs:
      - targets: ['app:8000']     # Имя сервиса из docker-compose
    metrics_path: '/metrics'

  # --------------------------------------------------------
  # Метрики Prometheus (само-мониторинг)
  # --------------------------------------------------------
  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']

  # --------------------------------------------------------
  # Метрики контейнеров Docker (cAdvisor)
  # --------------------------------------------------------
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']

  # --------------------------------------------------------
  # Метрики PostgreSQL (postgres-exporter)
  # --------------------------------------------------------
  - job_name: 'postgres'
    scrape_interval: 15s
    static_configs:
      - targets: ['postgres-exporter:9187']
